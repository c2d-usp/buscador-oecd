server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O padrão do nginx (1 MB) bloqueia fotos de perfil e os PNGs exportados em Resultados
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A atualização do banco pode ficar minutos sem imprimir (ex.: espera do rate limit
        # do GitHub); com o padrão de 60s o nginx cortaria o log no meio
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
